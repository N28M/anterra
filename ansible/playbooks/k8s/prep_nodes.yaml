---
# Prepare all 3 nodes for kubeadm: disable swap, load required kernel modules,
# set sysctls for bridged pod traffic, install containerd, and install
# kubeadm/kubelet/kubectl (held at the pinned version). Does NOT run
# `kubeadm init`/`kubeadm join` -- that's done by hand for exam practice.
- name: Prepare Kubernetes nodes
  hosts: k8s
  become: true
  gather_facts: true

  vars:
    kubernetes_version: "1.34"

  tasks:
    - name: Disable swap
      command: swapoff -a
      changed_when: true
      when: ansible_facts['swaptotal_mb'] > 0

    - name: Remove swap entry from /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\sswap\s'
        state: absent

    - name: Persist kernel modules required by containerd/kubernetes
      copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Load overlay kernel module
      modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      modprobe:
        name: br_netfilter
        state: present

    - name: Configure sysctl params for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
      register: k8s_sysctl

    - name: Apply sysctl params
      command: sysctl --system
      changed_when: true
      when: k8s_sysctl.changed

    - name: Install containerd
      apt:
        name:
          - containerd
          - gnupg
        state: present
        update_cache: true

    - name: Ensure /etc/containerd directory exists
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable systemd cgroup driver in containerd
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup = false'
        line: '\1SystemdCgroup = true'
        backrefs: true
      register: containerd_cgroup

    - name: Enable and start containerd
      systemd:
        name: containerd
        enabled: true
        state: started

    - name: Restart containerd after config change
      systemd:
        name: containerd
        state: restarted
      when: containerd_cgroup.changed

    - name: Ensure /etc/apt/keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes apt signing key
      get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
      register: k8s_key_download

    - name: Dearmor Kubernetes apt signing key
      shell: gpg --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /etc/apt/keyrings/kubernetes-apt-keyring.asc
      changed_when: k8s_key_download.changed

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
        state: present
        filename: kubernetes
        update_cache: true

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages at installed version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet service
      systemd:
        name: kubelet
        enabled: true

    - name: Output node prep summary
      debug:
        msg: |
          {{ inventory_hostname }} ready for kubeadm.

          - Swap: disabled
          - containerd: running with SystemdCgroup=true
          - kubelet/kubeadm/kubectl: installed and held at v{{ kubernetes_version }}.x

          kubelet will not be "active (running)" yet -- that's expected until
          `kubeadm init` (control-plane) or `kubeadm join` (workers) runs.
