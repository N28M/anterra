---
- name: Update samba-share system packages
  hosts: samba_share
  become: false
  gather_facts: false

  tasks:
    - name: Gather facts
      setup:

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Upgrade all system packages
      apt:
        upgrade: dist
      register: system_upgrade

    - name: Remove unused packages
      apt:
        autoremove: true

    - name: Ensure Samba is running
      systemd:
        name: smbd
        state: started

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Report result
      debug:
        msg: >-
          samba_share:
          {{ 'packages upgraded' if system_upgrade.changed else 'already up to date' }}.
          {{ 'REBOOT REQUIRED.' if reboot_required_file.stat.exists else 'No reboot needed.' }}
