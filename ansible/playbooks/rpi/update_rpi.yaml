---
- name: Update rpi system packages
  hosts: rpi
  become: true
  gather_facts: false

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Upgrade all system packages
      apt:
        upgrade: dist
      register: system_upgrade

    - name: Remove unused packages
      apt:
        autoremove: true

    # Services must remain running -- reboot is handled separately by the user.
    - name: Ensure Caddy is running
      systemd:
        name: caddy
        state: started

    - name: Ensure Tailscale is running
      systemd:
        name: tailscaled
        state: started
